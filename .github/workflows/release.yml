name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild manifest (ensure freshness)
        run: node scripts/build-manifest.mjs

      - name: Verify manifest matches commit
        run: |
          if ! git diff --quiet -- manifest.json; then
            echo "::error::manifest.json is stale at this tag. Tag was pushed without committing the latest manifest." >&2
            git --no-pager diff -- manifest.json
            exit 1
          fi

      - name: Create GitHub Release with manifest asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            manifest.json
          fail_on_unmatched_files: true
